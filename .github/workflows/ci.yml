name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: check (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      # the Python example plugin (examples/python-plugin) runs with uv; its test is skipped without it
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.12'
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm check
